<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>茗月髮型設計 - 預約服務</title>
  
  <meta property="og:title" content="茗月髮型設計 - 線上預約">
  <meta property="og:description" content="專業剪髮、染燙服務，24小時線上預約您的專屬時段！">
  <meta property="og:image" content="assets/images/background.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css?v=2.7"> 

  <style>
    /* =========================================
       強制覆蓋樣式 (Forced Overrides)
       ========================================= */

    :root {
      /* 修改：大幅降低透明度 (0.25)，讓背景雲朵更清楚 */
      --glass-bg: rgba(255, 255, 255, 0.25);
      --glass-border: rgba(255, 255, 255, 0.5);
      --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      
      /* 按鈕漸層色 (紫粉色系) */
      --btn-gradient: linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%);
      --text-dark: #4a4a4a;
      --text-highlight: #6c5ce7;
    }

    body {
      /* 確保背景圖固定，不會隨捲動跑掉 */
      background-image: url('assets/images/background.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: var(--text-dark);
      font-family: 'Noto Sans TC', sans-serif;
    }

    /* 1. 內容區塊透明化：強制移除原本的白底 */
    .container, .content-box, .modal-content {
      background: var(--glass-bg) !important; /* 強制覆蓋 style.css 的白底 */
      background-color: var(--glass-bg) !important;
      backdrop-filter: blur(8px); /* 毛玻璃模糊效果 */
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      border-radius: 20px;
      padding: 25px 20px !important;
      margin-bottom: 20px;
    }

    /* 2. 文字顏色修正：確保在淺色玻璃上清楚可見 */
    h1, h2, h3, .booking-title {
      color: #333 !important; /* 深灰色標題 */
      font-weight: 700;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
      margin-bottom: 15px;
    }

    p, .welcome-text, label {
      color: #2c3e50 !important; /* 深藍灰色內文 */
      font-weight: 500;
      text-shadow: 0 0 2px rgba(255,255,255,0.5);
    }

    /* 3. 表單排版修正 */
    .form-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
      width: 100%;
    }
    
    .form-label {
      margin-bottom: 5px;
      font-size: 1rem;
      color: #333 !important;
    }

    /* 4. 輸入框優化：半透明白底，讓字看得到 */
    .form-input, select.form-input {
      width: 100%;
      height: 45px;
      background: rgba(255, 255, 255, 0.6) !important;
      border: 1px solid rgba(255, 255, 255, 0.8) !important;
      border-radius: 10px;
      padding: 0 15px;
      font-size: 1rem;
      color: #000 !important; /* 強制輸入文字為黑色 */
      outline: none;
    }
    .form-input:focus {
      background: rgba(255, 255, 255, 0.9) !important;
      border-color: var(--text-highlight) !important;
    }

    /* 5. 服務選項按鈕：修正看不見的問題 */
    #service-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .service-button {
      flex: 1 1 45%; /* 手機上一行兩個 */
      background: rgba(255, 255, 255, 0.5) !important;
      border: 1px solid #fff !important;
      color: #333 !important; /* 強制文字深色 */
      padding: 12px;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .service-button.selected {
      background: var(--text-highlight) !important; /* 選中變深紫色 */
      color: #fff !important; /* 選中文字變白 */
      border-color: var(--text-highlight) !important;
      box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    }

    /* 6. 主要按鈕 (CTA) 優化 */
    .button-group {
      display: flex;
      gap: 15px;
      margin-top: 25px;
    }

    .form-button, .cta-button {
      border: none;
      height: 50px;
      border-radius: 25px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      display: flex; /* 確保文字置中 */
      align-items: center;
      justify-content: center;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }

    /* 送出預約 / 我要預約：使用漸層色 */
    .form-button.submit, #agreeButton, #successViewBookingsBtn {
      background: var(--btn-gradient) !important;
      color: #fff !important; /* 強制白字 */
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    /* 次要按鈕 (價目表、我的預約)：白底深字 */
    #priceListButton, #checkMyBookingsBtn, #successHomeBtn {
      background: rgba(255, 255, 255, 0.8) !important;
      color: var(--text-highlight) !important;
      border: 2px solid var(--text-highlight) !important;
    }

    /* 點擊效果 */
    button:active {
      transform: scale(0.96);
    }

    /* 連結修正 */
    #backToHomeBtn {
      color: #555 !important;
      text-decoration: underline;
      margin-top: 20px;
      display: inline-block;
    }
    
    /* 修正 Modal 裡的文字顏色 */
    #modal-price-list span {
      color: #333 !important;
    }
    #my-bookings-list .booking-card {
       background: rgba(255,255,255,0.7) !important; /* 卡片稍微不透明一點以便閱讀 */
       color: #333 !important;
    }

  </style>
</head>
<body>

  <div id="desktop-warning">
    <p>為了獲得最佳體驗，此預約系統建議使用手機操作，謝謝！</p>
  </div>

  <main id="main-content">
    
    <div id="welcome-screen" class="container">
      <div class="content-box" style="box-shadow: none !important; background: transparent !important; border: none !important;">
        <h1>茗月髮型設計</h1>
        <p>
          歡迎使用線上預約系統。<br>
          透明公開的價格，專屬您的設計時段。
        </p>
        <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 30px;">
          <button id="agreeButton" class="cta-button">我要預約</button>
          <button id="checkMyBookingsBtn" class="cta-button">我的預約</button>
        </div>
      </div>
    </div>

    <div id="booking-screen" class="container" style="display:none;">
      <h1 class="booking-title">預約服務</h1>
      <p class="welcome-text">Hi <span id="displayName" style="color: #6c5ce7; font-weight:bold;">...</span>，請填寫資訊：</p>

      <form id="booking-form">
        <div class="form-row">
          <label class="form-label" for="date-picker">選擇日期</label>
          <input type="date" id="date-picker" class="form-input" required>
        </div>

        <div class="form-row">
          <label class="form-label" for="time-slot">選擇時段</label>
          <select id="time-slot" class="form-input" required>
            <option value="" disabled selected>請先選擇日期</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">預約項目</label>
          <div id="service-options">
            <small style="color:#555;">(載入中...)</small>
          </div>
        </div>

        <div class="button-group">
          <button type="button" id="priceListButton" class="form-button">價目表</button>
          <button type="submit" class="form-button submit">送出預約</button>
        </div>
        
        <div style="text-align: center;">
            <a href="#" id="backToHomeBtn">返回首頁</a>
        </div>
      </form>
    </div>

    <div id="success-screen" class="container" style="display:none; text-align: center;">
      <div class="content-box" style="background: transparent !important; border: none !important; box-shadow: none !important;">
        <div style="font-size: 5rem; color: #fff; text-shadow: 0 0 10px #2ecc71; margin-bottom: 10px;">✓</div>
        <h1 style="color: #333;">預約申請已送出</h1>
        <p>
          我們已收到您的請求。<br>
          系統將通知設計師進行確認，<br>
          請留意您的 LINE 通知。
        </p>
        <div style="margin-top: 30px;">
          <button id="successViewBookingsBtn" class="form-button submit" style="margin-bottom: 15px;">查看我的預約</button>
          <button id="successHomeBtn" class="form-button">返回首頁</button>
        </div>
      </div>
    </div>

  </main>

  <div id="price-list-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeModalButton" class="close-button" aria-label="關閉" style="font-size: 1.5rem; color: #333;">&times;</button>
      <h2 style="text-align: center; color: #6c5ce7;">價目表</h2>
      <div id="modal-price-list" style="margin-top: 15px;"></div>
    </div>
  </div>

  <div id="register-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeRegisterModal" class="close-button" aria-label="關閉" style="font-size: 1.5rem; color: #333;">&times;</button>
      <h2 style="text-align: center;">基本資料填寫</h2>
      <p style="font-size: 0.9rem; text-align: center; margin-bottom: 20px;">
        為了方便聯繫確認，請填寫手機號碼。
      </p>
      <form id="register-form">
        <div class="form-row">
          <label class="form-label" for="reg-phone">手機號碼</label>
          <input id="reg-phone" class="form-input" type="tel" inputmode="numeric" pattern="09\d{8}" placeholder="09xxxxxxxx" required>
        </div>
        <div class="form-row">
          <label class="form-label" for="reg-birthday">生日</label>
          <input type="date" id="reg-birthday" class="form-input" required>
        </div>
        <div class="button-group">
          <button type="submit" class="form-button submit">儲存資料</button>
        </div>
      </form>
    </div>
  </div>

  <div id="my-bookings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeMyBookingsBtn" class="close-button" aria-label="關閉" style="font-size: 1.5rem; color: #333;">&times;</button>
      <h2 style="text-align: center; color: #6c5ce7;">我的預約</h2>
      <div id="my-bookings-list" style="max-height: 60vh; overflow-y: auto; margin-top: 15px;">
        <p style="text-align:center; color:#999;">載入中...</p>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
