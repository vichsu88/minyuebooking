<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>茗月髮型設計 - 預約服務</title>
  
  <meta property="og:title" content="茗月髮型設計 - 線上預約">
  <meta property="og:description" content="專業剪髮、染燙服務，24小時線上預約您的專屬時段！">
  <meta property="og:image" content="assets/images/background.png">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/style.css?v=2.5"> 
  <style>
    /* 頁面專屬微調樣式 (可之後移入 style.css) */
    .btn-secondary {
      background: #f0f0f0;
      color: #666;
      margin-top: 15px;
      font-size: 1rem;
      padding: 12px 30px;
    }
    .booking-card {
      background: #f9f9f9;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border-left: 5px solid #ccc;
      text-align: left;
    }
    .booking-card.status-pending { border-left-color: #f39c12; }
    .booking-card.status-confirmed { border-left-color: #2ecc71; }
    .booking-card.status-cancelled { border-left-color: #e74c3c; opacity: 0.7; }
    
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      color: #fff;
      font-size: 0.8rem;
      margin-bottom: 8px;
    }
    .badge-pending { background: #f39c12; }
    .badge-confirmed { background: #2ecc71; }
    .badge-cancelled { background: #e74c3c; }

    .success-icon {
      font-size: 4rem;
      color: #2ecc71;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div id="desktop-warning">
    <p>為了獲得最佳體驗，此預約系統建議使用手機操作，謝謝！</p>
  </div>

  <main id="main-content">
    
    <div id="welcome-screen" class="container">
      <div class="content-box">
        <h1>茗月髮型設計</h1>
        <p>
          歡迎使用線上預約系統。<br>
          請選擇您期望的時段，我們將盡快確認安排。
        </p>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <button id="agreeButton" class="cta-button">我要預約</button>
          <button id="checkMyBookingsBtn" class="cta-button" style="background-color: #9b59b6;">我的預約</button>
        </div>
      </div>
    </div>

    <div id="booking-screen" class="container" style="display:none;">
      <h1 class="booking-title">預約服務</h1>
      <p class="welcome-text">Hi <span id="displayName"></span>，請填寫預約資訊：</p>

      <form id="booking-form">
        <div class="form-row">
          <label class="form-label" for="date-picker">選擇日期：</label>
          <input type="date" id="date-picker" class="form-input" required>
        </div>

        <div class="form-row">
          <label class="form-label" for="time-slot">選擇時段：</label>
          <select id="time-slot" class="form-input" required>
            <option value="" disabled selected>請先選擇日期</option>
          </select>
        </div>

        <div class="form-row">
          <label class="form-label">預約項目：</label>
          <div id="service-options" class="form-input service-selection-box">
            <small>(服務項目載入中...)</small>
          </div>
        </div>

        <div class="button-group">
          <button type="button" id="priceListButton" class="form-button">價目表</button>
          <button type="submit" class="form-button submit">送出預約</button>
        </div>
        
        <div style="text-align: center; margin-top: 20px;">
            <a href="#" id="backToHomeBtn" style="color: #666; text-decoration: underline;">返回首頁</a>
        </div>
      </form>
    </div>

    <div id="success-screen" class="container" style="display:none; text-align: center;">
      <div class="content-box">
        <div class="success-icon">✓</div>
        <h1>預約申請已送出！</h1>
        <p>
          我們已收到您的預約請求。<br>
          系統將通知設計師進行確認，<br>
          請留意您的 LINE 通知。
        </p>
        <button id="successViewBookingsBtn" class="cta-button">查看我的預約</button>
        <br><br>
        <button id="successHomeBtn" class="cta-button btn-secondary">返回首頁</button>
      </div>
    </div>

  </main>

  <div id="price-list-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeModalButton" class="close-button" aria-label="關閉價目表">&times;</button>
      <h2>價目表</h2>
      <div id="modal-price-list"></div>
    </div>
  </div>

  <div id="register-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeRegisterModal" class="close-button" aria-label="關閉註冊視窗">&times;</button>
      <h2>第一次使用請先完成基本資料</h2>
      <p style="font-size: 0.9rem; color: #666; margin-bottom: 15px;">為了方便聯繫與確認預約，請填寫正確的手機號碼。</p>
      <form id="register-form">
        <div class="form-row">
          <label class="form-label" for="reg-phone">手機：</label>
          <input id="reg-phone" class="form-input" type="tel" inputmode="numeric" pattern="09\d{8}" placeholder="09xxxxxxxx" required>
        </div>
        <div class="form-row">
          <label class="form-label" for="reg-birthday">生日：</label>
          <input type="date" id="reg-birthday" class="form-input" required>
        </div>
        <div class="button-group">
          <button type="submit" class="form-button submit">儲存資料</button>
        </div>
      </form>
    </div>
  </div>

  <div id="my-bookings-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button id="closeMyBookingsBtn" class="close-button" aria-label="關閉">&times;</button>
      <h2>我的預約紀錄</h2>
      <div id="my-bookings-list" style="max-height: 60vh; overflow-y: auto;">
        <p style="text-align:center; color:#999;">載入中...</p>
      </div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="main.js"></script>
</body>
</html>
